<br />
<div class="container">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <h3>Listagem de pneus</h3>
          <div class="direita">
            <button type="button" class="btn btn-novo btn-rounded" mdbRipple (click)="new()">
              Novo
            </button>
          </div>
          <br />
          <table border="1" class="table table-striped">
            <thead>
              <tr>
                <th>Id</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Medida</th>
                <th>Ação</th>
              </tr>
            </thead>

            <tbody>
              @for (carro of lista; track $index) {
                <tr>
                  <td>{{ carro.id }}</td>
                  <td>{{ carro.marca }}</td>
                  <td>{{ carro.modelo }}</td>
                  <td>{{ carro.medida }}</td>
                  <td class="direita">
                    <button
                      type="button"
                      class="btn btn-primary btn-rounded"
                      mdbRipple
                      (click)="edit(carro)"
                    >
                      Editar
                    </button>

                    <button
                      type="button"
                      class="btn btn-danger btn-rounded"
                      mdbRipple
                      (click)="deletById(carro)"
                    >
                      Deletar
                    </button>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #modalCarro>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">Edição</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="modalRef.close()"></button>
  </div>
  <div class="modal-body">
    <app-carrosdatails [carro]="carroEdit" (retorno)="retornoDetalhe($event)"></app-carrosdatails>
  </div>
</ng-template>
